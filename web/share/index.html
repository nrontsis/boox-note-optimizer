<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Note Optimizer</title></head><body>
<p>Loading...</p>
<script>
// Fallback: SW didn't intercept the share POST. Register SW and ask user to retry.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js').then(reg => {
    return reg.active || new Promise(r => {
      const sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', () => { if (sw.state === 'active') r(sw); });
    });
  }).then(() => {
    document.querySelector('p').textContent = 'Please try sharing again.';
  }).catch(() => {
    window.location.href = '../';
  });
} else {
  window.location.href = '../';
}
</script>
</body></html>
