<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Loading...</title></head><body>
<p id="msg">Loading shared file...</p>
<script>
// Fallback page: SW didn't intercept the share POST (cold start / SW not yet active).
// Register SW so future shares work, then redirect to app.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    return reg.active || new Promise(r => {
      const sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', () => { if (sw.state === 'active') r(sw); });
    });
  }).then(() => {
    document.getElementById('msg').textContent = 'Please try sharing again — the app is now ready.';
  }).catch(() => {
    window.location.href = './';
  });
} else {
  window.location.href = './';
}
</script>
</body></html>
