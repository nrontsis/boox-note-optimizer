<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Share Debug</title></head><body>
<script>
alert('SHARE FALLBACK: SW did not intercept. URL=' + location.href + ' method=GET(fallback)');
// Register SW so future shares work, then redirect to app.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    return reg.active || new Promise(r => {
      const sw = reg.installing || reg.waiting;
      sw.addEventListener('statechange', () => { if (sw.state === 'active') r(sw); });
    });
  }).then(() => {
    alert('SW now active. Please try sharing again.');
  }).catch(e => {
    alert('SW registration failed: ' + e.message);
    window.location.href = './';
  });
} else {
  alert('No SW support');
  window.location.href = './';
}
</script>
</body></html>
