name: Build Android APK

on:
  push:
    branches: [main]
    paths: [web/manifest.json, .github/workflows/build-apk.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          mkdir -p twa && cd twa
          bubblewrap init --manifest="https://nrontsis.github.io/boox-note-optimizer/manifest.json" --directory=.
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android

      - name: Build APK
        run: |
          cd twa
          bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boox-optimizer-apk
          path: twa/app-release-signed.apk
