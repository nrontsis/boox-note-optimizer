[package]
name = "boox-optimizer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.85"
byteorder = "1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zip = { version = "2", default-features = false, features = ["deflate"] }
console_error_panic_hook = "0.1"
base64 = "0.22"
svgtypes = "0.15"

[dependencies.web-sys]
version = "0.3.85"
features = [
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "CanvasPattern",
  "HtmlImageElement",
  "TextMetrics",
  "Window",
  "Document",
  "Element"
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
